{% extends "base.html" %}
{% block title %}Edit Task - TaskManager{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Edit Task</h2>
    <form action="/todos/update/{{ todo.id }}" method="POST">
        <div class="form-group">
            <label for="title">Task Title</label>
            <input type="text" id="title" name="title" value="{{ todo.title }}" required autocomplete="off">
        </div>
        <button type="submit" class="btn-full">Save Changes</button>
        <a href="/todos" class="btn-cancel">Cancel</a>
    </form>
</div>
{% endblock %}
