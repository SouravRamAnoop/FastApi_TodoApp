{% extends "base.html" %}
{% block title %}Register - TaskManager{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Create an Account</h2>
    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form action="/register" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="mobilenumber">Mobile Number</label>
            <input type="text" id="mobilenumber" name="mobilenumber" required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-full">Sign Up</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="/login">Login here</a></p>
</div>
{% endblock %}
